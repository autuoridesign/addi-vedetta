# Le prove della vedetta (prova_vedetta.py: siti e GitHub finti, nessuna rete vera) a ogni modifica.
name: Prove

on:
  push:
    paths: ['vedetta.py', 'prova_vedetta.py', 'campanello.py', 'prova_campanello.py', 'siti.json', '.github/workflows/prove.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    name: Le prove della vedetta
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: siti.json si legge
        run: python3 -c "import json; s = json.load(open('siti.json'))['siti']; assert s and all({'nome', 'chiave', 'indirizzo', 'orologi'} <= set(x) for x in s); print(len(s), 'siti')"
      - name: Le prove
        run: python3 prova_vedetta.py
      - name: Le prove del campanello
        run: python3 prova_campanello.py
