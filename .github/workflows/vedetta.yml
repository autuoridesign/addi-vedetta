# La vedetta dei siti di addiplatform (vedetta.py): ogni 10 minuti, da GitHub, fuori da Ergonet. La sveglia la dà
# cron-job.org (campanello.py), che ogni 10 minuti preme «Run workflow» da fuori: l'orario qui sotto da solo non basta.
# Gli avvisi sono issue di questo repository: GitHub manda l'email a Marco. Se la vedetta stessa non può lavorare, il giro
# finisce in rosso e arriva l'email «Run failed» di GitHub.
name: Vedetta

on:
  schedule:
    # l'orario di riserva, se il campanello tace: GitHub lo fa partire quando ha posto (dal 19/10/26 ogni 2,5-6,5 ore, non
    # ogni 10 minuti). Lontano dall'inizio dell'ora, coi minuti elencati: con «3-59/10» il 18/10/26 non partiva niente.
    - cron: '3,13,23,33,43,53 * * * *'
    - cron: '17 5 1 * *'        # il primo del mese, un segno di vita: GitHub spegne gli orari dopo 60 giorni senza novità
  workflow_dispatch:            # il campanello di cron-job.org, ogni 10 minuti; e il pulsante «Run workflow», con la prova
    inputs:
      prova:
        description: 'Manda un avviso di prova (si apre e si chiude subito: arriva l''email?)'
        type: boolean
        default: false

permissions:
  contents: write   # solo per il segno di vita del mese
  issues: write     # gli avvisi

concurrency:
  group: vedetta
  cancel-in-progress: false

jobs:
  guarda:
    name: Guarda i siti
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Guarda i siti
        if: github.event.schedule != '17 5 1 * *'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVA: ${{ inputs.prova && '--prova' || '' }}
        run: python3 vedetta.py $PROVA

      - name: Il segno di vita del mese
        if: github.event.schedule == '17 5 1 * *'
        run: |
          date -u +%Y-%m-%d > vivo.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vivo.txt
          git commit -m "La vedetta è viva: $(date -u +%Y-%m-%d)"
          git push
